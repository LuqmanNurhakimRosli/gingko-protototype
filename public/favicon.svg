<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ginkgo">
  <title>Ginkgo</title>
  <defs>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BD46E"/>
      <stop offset=".6" stop-color="#08A045"/>
      <stop offset="1" stop-color="#05753A"/>
    </linearGradient>
    <linearGradient id="g-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FBDF9"/>
      <stop offset="1" stop-color="#1A73E8"/>
    </linearGradient>
    <!-- ginkgo leaf: a broad fan with a shallow notch, narrowing to the stalk -->
    <path id="g-shape" d="M32 55.5 C25 47 11 34.5 4.6 24.6 C2.8 21.6 3.6 17.4 7 15.2 C14 10.6 22.4 8.2 29.4 9.6 L32 13.2 L34.6 9.6 C41.6 8.2 50 10.6 57 15.2 C60.4 17.4 61.2 21.6 59.4 24.6 C53 34.5 39 47 32 55.5 Z"/>
    <clipPath id="g-clip"><use href="#g-shape"/></clipPath>
  </defs>
  <use href="#g-shape" fill="url(#g-leaf)"/>
  <g clip-path="url(#g-clip)">
    <!-- veins fanning from the stalk -->
    <g stroke="#FFFFFF" stroke-opacity=".18" stroke-width=".8" fill="none">
      <path d="M32 56 L6 18"/><path d="M32 56 L15 11"/><path d="M32 56 L24 9"/>
      <path d="M32 56 L40 9"/><path d="M32 56 L49 11"/><path d="M32 56 L58 18"/>
    </g>
    <!-- 2D city skyline -->
    <g fill="#FFFFFF">
      <rect x="9.5" y="27" width="5.2" height="12" rx=".5"/>
      <rect x="15.4" y="21.5" width="5.6" height="17.5" rx=".5"/>
      <path d="M21.8 39 V19 L24.6 14.6 L27.4 19 V39 Z"/>
      <rect x="24.1" y="11.2" width="1" height="4"/>
      <rect x="28.2" y="23.5" width="6.6" height="15.5" rx=".5"/>
      <path d="M35.6 39 V18.4 H40.8 V39 Z"/>
      <rect x="37.7" y="14.6" width=".9" height="4"/>
      <rect x="41.6" y="25" width="5.2" height="14" rx=".5"/>
      <!-- dome and minaret -->
      <path d="M47.6 39 V31.8 A4.1 4.1 0 0 1 55.8 31.8 V39 Z"/>
      <rect x="51.3" y="25.8" width=".8" height="2.3"/>
      <rect x="56.6" y="26" width="1.7" height="13"/>
    </g>
    <g fill="#08A045" fill-opacity=".5">
      <rect x="16.9" y="24.5" width="1.1" height="1.3"/><rect x="18.8" y="24.5" width="1.1" height="1.3"/>
      <rect x="16.9" y="28" width="1.1" height="1.3"/><rect x="18.8" y="28" width="1.1" height="1.3"/>
      <rect x="16.9" y="31.5" width="1.1" height="1.3"/><rect x="18.8" y="31.5" width="1.1" height="1.3"/>
      <rect x="29.8" y="26.5" width="1.1" height="1.3"/><rect x="32" y="26.5" width="1.1" height="1.3"/>
      <rect x="29.8" y="30" width="1.1" height="1.3"/><rect x="32" y="30" width="1.1" height="1.3"/>
      <rect x="11" y="30" width="1" height="1.2"/><rect x="12.8" y="30" width="1" height="1.2"/>
      <rect x="43" y="28" width="1" height="1.2"/><rect x="44.8" y="28" width="1" height="1.2"/>
    </g>
    <!-- floodwater -->
    <path d="M0 37.6 C4 35.6 8 35.6 12 37.6 S20 39.6 24 37.6 S32 35.6 36 37.6 S44 39.6 48 37.6 S56 35.6 64 37.6 V64 H0 Z" fill="url(#g-water)"/>
    <path d="M0 43 C4 41.3 8 41.3 12 43 S20 44.7 24 43 S32 41.3 36 43 S44 44.7 48 43 S56 41.3 64 43" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.3" fill="none"/>
  </g>
  <!-- stalk -->
  <path d="M32 54.5 C32.3 57.4 33.3 59.8 35.4 61.8" stroke="#05753A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
</svg>
